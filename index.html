:root[data-theme=dark]{color-scheme:dark;--bg:#0d1420;--card:#152033;--tx:#e6ebf3;--mu:#93a0b5;--bd:#26344b;--nv:#08121f;--bl:#4c94ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.sb{width:210px;background:var(--nv);color:#cfd8e6;padding:14px 8px;flex-shrink:0}
.sb h1{font-size:15px;color:#fff;margin:4px 10px 14px;letter-spacing:.5px}.sb h1 small{display:block;font-weight:400;color:#8fa3c2;font-size:11px}
.sb a{display:block;padding:9px 12px;border-radius:6px;cursor:pointer;color:#cfd8e6}.sb a.on,.sb a:hover{background:#1f6feb;color:#fff}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 14px;font-size:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}.k{color:var(--mu);font-size:12px}.v{font-size:22px;font-weight:650;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.r{text-align:right}button,.b{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}.b2{background:transparent;color:var(--bl);border:1px solid var(--bd)}.bd{color:var(--er);background:transparent;border:1px solid var(--bd)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{max-width:260px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}.Paid,.Approved,.Converted{background:#d5f0e0;color:#0f6a37}.Unpaid,.Rejected,.Lost,.Overdue{background:#fbdcda;color:#9c2420}.Partially,.Sent,.Draft{background:#fdebc8;color:#8a5600}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}.mb{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:560px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
#pr{display:none}
@media(max-width:720px){.app{flex-direction:column}.sb{width:100%;display:flex;overflow-x:auto;padding:6px}.sb h1{display:none}.sb a{white-space:nowrap}.f{grid-template-columns:1fr}}
@media print{.app,.mo{display:none!important}#pr{display:block;color:#000;background:#fff;font-size:12px}#pr table td,#pr table th{border:1px solid #999;padding:4px;white-space:normal;color:#000}}

function calc(items,intra){let sub=0,disc=0,tax=0,gst=0;const rows=items.map(i=>{const base=i.qty*i.rate,d=base*i.disc/100,t=base-d,g=t*i.gst/100;sub+=base;disc+=d;tax+=t;gst+=g;return{t,g,amt:t+g}});

<p style="text-align:right">Taxable: ${inr(r.tax)}<br>${it?`CGST: ${inr(r.cgst)} | SGST: ${inr(r.sgst)}`:`IGST: ${inr(r.igst)}`}<br>Round-off: ${inr(r.round)}<br><b style="font-size:15px">Grand Total: ${inr(r.grand)}</b></p><p><b>Amount in words:</b> ${words(r.grand)} Rupees Only</p>${extra}</div>`}
function prQ(id){const q=S.quotes.find(x=>x.id==id),c=cust(q.cid);return dl('QUOTATION',q.no,q.date,c,q.items,intra(c),{desc:[q.desc??('PRICE VALID FOR '+q.valid+' DAYS'),q.remarks],terms:['Validity : '+q.valid+' Days','Price : '+q.deliv,'P&F : '+(q.pf||'AT Actual'),'Payment terms : '+q.terms,'Authorized distributor : '+(q.dist||DIST)]});$('#pr').innerHTML=doc('QUOTATION',q.no,q.date,c,q.items,intra(c),`<p>Validity: ${q.valid} days | Payment: ${e(q.terms)} | Delivery: ${e(q.deliv)}<br>${e(q.remarks)}</p><p style="font-size:11px">Add bank details in Settings. This is a computer-generated quotation.</p>`);window.print()}
function q2i(id){const q=S.quotes.find(x=>x.id==id),c=cust(q.cid);const due=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
q.items.forEach(i=>{const p=S.products.find(x=>x.id==i.pid);if(p)p.stock-=i.qty});
const inv={id:++S.seq.i,no:'AS/INV/'+pad(S.seq.i),date:today(),due,cid:q.cid,items:JSON.parse(JSON.stringify(q.items)),intra:intra(c),pays:[]};S.invoices.push(inv);q.inv=inv.no;sv();go('invoices')}
function invoices(){$('#m').innerHTML=`<h2>Invoices</h2><div class="bar"><button class="b2" onclick="ex('xlsx','invoices')">Excel</button><button class="b2" onclick="ex('pdf','invoices')">PDF</button></div><div class="c tw"><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th class="r">Total</th><th class="r">Balance</th><th>Status</th><th></th></tr></thead><tbody>${S.invoices.map(i=>{const g=calc(i.items,i.intra).grand;return `<tr><td>${e(i.no)}</td><td>${fd(i.date)}</td><td>${e(cust(i.cid).name)}</td><td class="r">${inr(g)}</td><td class="r">${inr(g-paid(i))}</td><td>${tag(istat(i))}</td><td class="r"><button class="b2" onclick="iedit(${i.id})">Edit</button> <button onclick="pay(${i.id})">Record payment</button> <button class="b2" onclick="prI(${i.id})">PDF / Print</button> <button class="bd" onclick="idel(${i.id})">Delete</button></td></tr>`}).join('')||'<tr><td>Approve a quotation, then convert it to an invoice.</td></tr>'}</tbody></table></div>`}
function idel(id){const i=S.invoices.find(x=>x.id==id);ask('Delete invoice '+e(i.no)+(i.pays.length?' and its '+i.pays.length+' recorded payment(s) ('+inr(paid(i))+')':'')+'? Stock will be restored and the quotation can be converted again.',()=>{i.items.forEach(t=>{const p=S.products.find(x=>x.id==t.pid);if(p)p.stock+=t.qty});S.quotes.forEach(q=>{if(q.inv==i.no)delete q.inv});S.invoices=S.invoices.filter(x=>x.id!=id);sv();invoices()})}
function pay(id){const i=S.invoices.find(x=>x.id==id),bal=calc(i.items,i.intra).grand-paid(i);$('#mo').innerHTML=`<div class="mo"><div class="mb"><h3>Record payment</h3><p class="k">${e(i.no)} · Balance ${inr(bal)}</p><input id="pa" type="number" step="any" value="${bal.toFixed(2)}"><p><button onclick="pay2(${id})">Save payment</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function pay2(id){const i=S.invoices.find(x=>x.id==id),bal=calc(i.items,i.intra).grand-paid(i),a=parseFloat($('#pa').value);if(!(a>0)||a>bal+.005){toast('Enter an amount between 0 and the balance');return}i.pays.push({date:today(),amt:a});sv();$('#mo').innerHTML='';invoices()}
function payOld(id){const i=S.invoices.find(x=>x.id==id),bal=calc(i.items,i.intra).grand-paid(i);const a=parseFloat(prompt('Amount received (balance '+bal.toFixed(2)+')',bal.toFixed(2)));if(!(a>0)||a>bal+.005){if(!isNaN(a))alert('Invalid amount');return}i.pays.push({date:today(),amt:a});sv();invoices()}
function prI(id){const i=S.invoices.find(x=>x.id==id),c=cust(i.cid);return dl('TAX INVOICE',i.no,i.date,c,i.items,i.intra,{desc:['Paid so far: Rs. '+paid(i).toFixed(2),'Due date: '+fd(i.due)],terms:['Authorized distributor : '+DIST]});$('#pr').innerHTML=doc('TAX INVOICE',i.no,i.date,c,i.items,i.intra,`<p>Paid: ${inr(paid(i))} | Due date: ${fd(i.due)}</p>`);window.print()}

async function savef(fn,data){try{const D=await claude.use('downloads');if(!D)throw 0;await D.save({filename:fn,data})}catch(x){if(!x||x.code!=='declined')toast('Download is not available in this view')}}
function inventory(){const m=S.moves.slice(-10).reverse();$('#m').innerHTML=`<h2>Inventory</h2><div class="c tw"><table><thead><tr><th>Code</th><th>Product</th><th>Stock</th><th>Min</th><th></th></tr></thead><tbody>${S.products.map(p=>`<tr><td>${e(p.code)}</td><td>${e(p.name)}</td><td>${p.stock<=p.min?`<b style="color:var(--er)">${p.stock} ⚠</b>`:p.stock}</td><td>${p.min}</td><td class="r"><button onclick="adj(${p.id})">Adjust stock</button></td></tr>`).join('')}</tbody></table></div><h3>Recent stock movements</h3><div class="c tw"><table><thead><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th></tr></thead><tbody>${m.map(x=>`<tr><td>${fd(x.date)}</td><td>${e(S.products.find(p=>p.id==x.pid)?.name)}</td><td>${x.qty>0?'+':''}${x.qty}</td><td>${e(x.why)}</td></tr>`).join('')||'<tr><td>No movements yet</td></tr>'}</tbody></table></div>`}
function adj(id){const p=S.products.find(x=>x.id==id);$('#mo').innerHTML=`<div class="mo"><div class="mb"><h3>${e(p.name)}</h3><p class="k">Current stock: ${p.stock}</p><div class="f"><div><label>Change (+ add / − reduce)</label><input id="aq" type="number" step="any"></div><div><label>Reason</label><input id="ar" value="Stock adjustment"></div></div><p><button onclick="adj2(${id})">Save</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function adj2(id){const p=S.products.find(x=>x.id==id),v=parseFloat($('#aq').value);if(!v||p.stock+v<0){toast('Enter a valid change (stock cannot go below 0)');return}p.stock+=v;S.moves.push({date:today(),pid:id,qty:v,why:$('#ar').value});sv();$('#mo').innerHTML='';inventory()}
function purchases(){$('#m').innerHTML=`<h2>Purchases</h2><div class="bar"><button onclick="PE=0;pnew()">+ New purchase</button><button class="b2" onclick="ex('xlsx','purchases')">Excel</button><button class="b2" onclick="ex('pdf','purchases')">PDF</button></div><div class="c tw"><table><thead><tr><th>Bill no.</th><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th class="r">Total</th><th></th></tr></thead><tbody>${S.purchases.map(x=>`<tr><td>${e(x.bill)}</td><td>${fd(x.date)}</td><td>${e(S.suppliers.find(s=>s.id==x.sid)?.name)}</td><td>${e(S.products.find(p=>p.id==x.pid)?.name)}</td><td>${x.qty}</td><td class="r">${inr(x.total)}</td><td class="r"><button class="b2" onclick="pedit(${x.id})">Edit</button> <button class="bd" onclick="pdel(${x.id})">Delete</button></td></tr>`).join('')||'<tr><td>No purchases yet</td></tr>'}</tbody></table></div>`}
function pnew(){if(!S.suppliers.length||!S.products.length){toast('Add a supplier and a product first');return}$('#mo').innerHTML=`<div class="mo"><div class="mb"><h3>New purchase</h3><div class="f"><div><label>Supplier</label><select id="ps">${S.suppliers.map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select></div><div><label>Product</label><select id="pp">${S.products.map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select></div><div><label>Bill no.</label><input id="pb"></div><div><label>Date</label><input id="pd" type="date" value="${today()}"></div><div><label>Quantity</label><input id="pq" type="number" step="any"></div><div><label>Rate (excl. GST)</label><input id="prc" type="number" step="any"></div></div><p class="k">Stock is added when you save.</p><p><button onclick="psave()">Save purchase</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function psave(){const p=S.products.find(x=>x.id==$('#pp').value),q=parseFloat($('#pq').value),r=parseFloat($('#prc').value);if(!(q>0)||!(r>=0)){toast('Enter quantity and rate');return}{const o=PE&&S.purchases.find(y=>y.id==PE);if(o){const op=S.products.find(z=>z.id==o.pid);if(op)op.stock=Math.max(0,op.stock-o.qty);S.purchases=S.purchases.filter(y=>y.id!=PE)}}S.purchases.push({id:PE||Date.now(),bill:$('#pb').value,date:$('#pd').value,sid:+$('#ps').value,pid:p.id,qty:q,rate:r,total:q*r*(1+p.gst/100)});p.stock+=q;p.buy=r;PE=0;S.moves.push({date:$('#pd').value,pid:p.id,qty:q,why:'Purchase '+$('#pb').value});sv();$('#mo').innerHTML='';purchases()}
function pdel(id){ask('Delete this purchase? Stock will be reduced.',()=>{const x=S.purchases.find(y=>y.id==id),p=S.products.find(z=>z.id==x.pid);if(p)p.stock=Math.max(0,p.stock-x.qty);S.purchases=S.purchases.filter(y=>y.id!=id);sv();purchases()})}
function accounts(){list('expenses','Accounts – Expenses',['date','name','cat','amt'],XF,{date:fd,amt:inr});const sales=S.invoices.reduce((a,i)=>a+calc(i.items,i.intra).grand,0),rec=S.invoices.reduce((a,i)=>a+paid(i),0),pu=S.purchases.reduce((a,x)=>a+x.total,0),ex=S.expenses.reduce((a,x)=>a+x.amt,0),cd=(k,v)=>`<div class="c"><div class="k">${k}</div><div class="v">${inr(v)}</div></div>`;$('#m').firstElementChild.insertAdjacentHTML('afterend',`<div class="g">${cd('Sales',sales)}${cd('Received',rec)}${cd('Outstanding',sales-rec)}${cd('Purchases',pu)}${cd('Expenses',ex)}${cd('Net (Sales − Purchases − Expenses)',sales-pu-ex)}</div>`)}
function reports(){const inv=S.invoices,agg=f=>{const m={};inv.forEach(i=>{const r=calc(i.items,i.intra);i.items.forEach((t,n)=>{const k=f(t);m[k]=m[k]||[0,0];m[k][0]+=t.qty;m[k][1]+=r.rows[n].amt})});return Object.entries(m).map(([k,v])=>[k,v[0],v[1].toFixed(2)])},cnt=(a,f)=>{const m={};a.forEach(x=>m[f(x)]=(m[f(x)]||0)+1);return Object.entries(m)},g=[0,0,0];inv.forEach(i=>{const r=calc(i.items,i.intra);g[0]+=r.cgst;g[1]+=r.sgst;g[2]+=r.igst});
SECS=[{t:'Product-wise sales',h:['Product','Qty','Amount'],r:agg(t=>t.desc)},{t:'Brand-wise sales',h:['Brand','Qty','Amount'],r:agg(t=>S.products.find(p=>p.id==t.pid)?.brand||'Other')},{t:'Customer sales & outstanding',h:['Customer','Sales','Outstanding'],r:S.customers.map(c=>{const a=inv.filter(i=>i.cid==c.id);return[c.name,a.reduce((s,i)=>s+calc(i.items,i.intra).grand,0).toFixed(2),a.reduce((s,i)=>s+calc(i.items,i.intra).grand-paid(i),0).toFixed(2)]}).filter(r=>+r[1]),},{t:'GST summary',h:['Tax','Amount'],r:[['CGST',g[0].toFixed(2)],['SGST',g[1].toFixed(2)],['IGST',g[2].toFixed(2)]]},{t:'Lead sources',h:['Source','Leads'],r:cnt(S.leads,l=>l.src)},{t:'Quotations by status',h:['Status','Count'],r:cnt(S.quotes,q=>q.status)},{t:'Low-stock products',h:['Product','Stock','Min'],r:S.products.filter(p=>p.stock<=p.min).map(p=>[p.name,p.stock,p.min])}];
$('#m').innerHTML='<h2>Reports</h2>'+SECS.map((s,n)=>`<div class="c tw" style="margin-bottom:12px"><div class="bar" style="justify-content:space-between"><b>${s.t}</b><span><button class="b2" onclick="csv(${n})">CSV</button> <button class="b2" onclick="xl(SECS[${n}].t,SECS[${n}].h,SECS[${n}].r)">Excel</button> <button class="b2" onclick="pl(SECS[${n}].t,SECS[${n}].h,SECS[${n}].r)">PDF</button></span></div><table><thead><tr>${s.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${s.r.map(r=>`<tr>${r.map(v=>`<td>${e(v)}</td>`).join('')}</tr>`).join('')||'<tr><td>No data</td></tr>'}</tbody></table></div>`).join('')}
function csv(n){const s=SECS[n];savef('report-'+s.t.replace(/\W+/g,'-').toLowerCase()+'.csv',[s.h,...s.r].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'))}
function settings(){$('#m').innerHTML=`<h2>Settings</h2><div class="c"><b>${CO.n}</b><br>${CO.a}<br>GSTIN: ${CO.g}<br>${CO.p}<br>${CO.e}</div><p><button onclick="savef('acme-backup.json',JSON.stringify(S))">Download backup (JSON)</button> <button class="bd" onclick="ask('Erase ALL data and restore the sample data?',()=>{S=seed();ext();sv();go('dash')})">Reset data</button></p><p class="k">Data is stored in this browser only.</p>`}
Object.assign(V,{inventory,purchases,suppliers:()=>list('suppliers','Suppliers',['name','contact','mobile','gstin','address'],SF),hr:()=>list('employees','HR & Employees',['name','desig','dept','mobile','join','salary','role'],EF,{join:fd,salary:inr}),accounts,reports,settings});

const DATA={quotes:()=>['Quotations',['Quotation No','Date','Customer','Total','Status'],S.quotes.map(q=>[q.no,fd(q.date),cust(q.cid).name,calc(q.items,intra(cust(q.cid))).grand,q.status])],invoices:()=>['Invoices',['Invoice No','Date','Customer','Total','Paid','Balance','Status'],S.invoices.map(i=>{const g=calc(i.items,i.intra).grand;return[i.no,fd(i.date),cust(i.cid).name,g,paid(i),g-paid(i),istat(i)]})],purchases:()=>['Purchases',['Bill no','Date','Supplier','Product','Qty','Total'],S.purchases.map(x=>[x.bill,fd(x.date),S.suppliers.find(s=>s.id==x.sid)?.name||'',S.products.find(p=>p.id==x.pid)?.name||'',x.qty,Math.round(x.total*100)/100])]};
function ex(kind,key){let t,h,r;if(DATA[key]){[t,h,r]=DATA[key]()}else{const L=LAST;t=L.title;h=L.cols.map(c=>L.F.find(f=>f[0]==c)[1]);r=S[L.key].map(x=>L.cols.map(c=>/date|join|follow/.test(c)?fd(x[c]):(x[c]??'')))}kind=='xlsx'?xl(t,h,r):pl(t,h,r)}
function xl(t,h,r){if(!window.XLSX){toast('Excel library did not load');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...r]),'Sheet1');savef(t.replace(/\W+/g,'-').toLowerCase()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function pl(t,h,r){const J=window.jspdf;if(!J){toast('PDF library did not load');return}const d=new J.jsPDF('l');d.setFontSize(14);d.text(CO.n+' - '+t,14,14);d.autoTable({startY:20,head:[h],body:r.map(x=>x.map(v=>String(v))),styles:{fontSize:8},headStyles:{fillColor:[11,31,63]}});savef(t.replace(/\W+/g,'-').toLowerCase()+'.pdf',d.output('blob'))}
function pedit(id){const x=S.purchases.find(y=>y.id==id);PE=id;pnew();if(!$('#ps'))return;$('#ps').value=x.sid;$('#pp').value=x.pid;$('#pb').value=x.bill||'';$('#pd').value=x.date;$('#pq').value=x.qty;$('#prc').value=x.rate}
var IE;function iedit(id){IE=JSON.parse(JSON.stringify(S.invoices.find(x=>x.id==id)));rie()}
function rie(){const i=IE,I=(k,n,w)=>`<input type="number" step="any" value="${i.items[n][k]}" style="width:${w}px" onchange="IE.items[${n}].${k}=+this.value">`;$('#mo').innerHTML=`<div class="mo"><div class="mb" style="max-width:760px"><h3>Edit ${e(i.no)}</h3><div class="f"><div><label>Customer</label><select onchange="IE.cid=this.value;IE.intra=intra(cust(this.value))">${S.customers.map(c=>`<option value="${c.id}" ${c.id==i.cid?'selected':''}>${e(c.name)}</option>`).join('')}</select></div><div><label>Invoice date</label><input type="date" value="${i.date}" onchange="IE.date=this.value"></div><div><label>Due date</label><input type="date" value="${i.due}" onchange="IE.due=this.value"></div></div><div class="tw"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Disc %</th><th>GST %</th><th></th></tr></thead><tbody>${i.items.map((t,n)=>`<tr><td>${e(t.desc)}</td><td>${I('qty',n,70)}</td><td>${I('rate',n,90)}</td><td>${I('disc',n,64)}</td><td>${I('gst',n,64)}</td><td><button class="bd" onclick="IE.items.splice(${n},1);rie()">✕</button></td></tr>`).join('')}</tbody></table></div><h4>Payments</h4>${i.pays.map((p,n)=>`<div>${fd(p.date)} – ${inr(p.amt)} <button class="bd" onclick="IE.pays.splice(${n},1);rie()">Remove</button></div>`).join('')||'<div class="k">No payments</div>'}<p><button onclick="isave(${i.id})">Save changes</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function isave(id){if(!IE.items.length||IE.items.some(t=>!(t.qty>0))){toast('Keep at least one item with quantity > 0');return}if(paid(IE)>calc(IE.items,IE.intra).grand+.005){toast('Payments exceed the invoice total. Remove or reduce a payment first.');return}const o=S.invoices.find(x=>x.id==id);o.items.forEach(t=>{const p=S.products.find(x=>x.id==t.pid);if(p)p.stock+=t.qty});IE.items.forEach(t=>{const p=S.products.find(x=>x.id==t.pid);if(p)p.stock=Math.max(0,p.stock-t.qty)});S.invoices[S.invoices.findIndex(x=>x.id==id)]=IE;sv();$('#mo').innerHTML='';invoices()}
go('dash');
