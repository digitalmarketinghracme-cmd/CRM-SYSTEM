<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ACME Switchgears CRM</title>
<style>
:root{--bg:#f1f3f7;--card:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#dfe3ea;--nv:#0b1f3f;--bl:#1f6feb;--ok:#168a4a;--wn:#c77a00;--er:#c4302b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d1420;--card:#152033;--tx:#e6ebf3;--mu:#93a0b5;--bd:#26344b;--nv:#08121f;--bl:#4c94ff}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1420;--card:#152033;--tx:#e6ebf3;--mu:#93a0b5;--bd:#26344b;--nv:#08121f;--bl:#4c94ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.sb{width:210px;background:var(--nv);color:#cfd8e6;padding:14px 8px;flex-shrink:0}
.sb h1{font-size:15px;color:#fff;margin:4px 10px 14px;letter-spacing:.5px}.sb h1 small{display:block;font-weight:400;color:#8fa3c2;font-size:11px}
.sb a{display:block;padding:9px 12px;border-radius:6px;cursor:pointer;color:#cfd8e6}.sb a.on,.sb a:hover{background:#1f6feb;color:#fff}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 14px;font-size:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}.k{color:var(--mu);font-size:12px}.v{font-size:22px;font-weight:650;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.r{text-align:right}button,.b{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}.b2{background:transparent;color:var(--bl);border:1px solid var(--bd)}.bd{color:var(--er);background:transparent;border:1px solid var(--bd)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{max-width:260px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}.Paid,.Approved,.Converted{background:#d5f0e0;color:#0f6a37}.Unpaid,.Rejected,.Lost,.Overdue{background:#fbdcda;color:#9c2420}.Partially,.Sent,.Draft{background:#fdebc8;color:#8a5600}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}.mb{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:560px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
#pr{display:none}
@media(max-width:720px){.app{flex-direction:column}.sb{width:100%;display:flex;overflow-x:auto;padding:6px}.sb h1{display:none}.sb a{white-space:nowrap}.f{grid-template-columns:1fr}}
@media print{.app,.mo{display:none!important}#pr{display:block;color:#000;background:#fff;font-size:12px}#pr table td,#pr table th{border:1px solid #999;padding:4px;white-space:normal;color:#000}}

window.claude=window.claude||{use:async n=>n==='downloads'?{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return{status:'saved'}}}:null};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script></head><body>
<div class="app"><nav class="sb" id="nav"><h1>ACME SWITCHGEARS<small>CRM &amp; ERP</small></h1></nav><main id="m"></main></div><div id="pr"></div><div id="mo"></div>
<script>
const CO={n:'ACME SWITCHGEARS',a:'107, Angappa Naicken Street, George Town, Chennai, Tamil Nadu – 600001',g:'33AASFA3221F1ZU',p:'+91-44-42061113 / 42061114 / 43851115',e:'acmeswitchgears@ymail.com'};
const $=s=>document.querySelector(s);
function ask(msg,cb){window._askCb=cb;$('#mo').innerHTML=`<div class="mo"><div class="mb" style="max-width:440px"><h3>Please confirm</h3><p>${msg}</p><p><button class="bd" onclick="askYes()">Yes, continue</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function askYes(){const f=window._askCb;window._askCb=null;$('#mo').innerHTML='';if(f)f()}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:90vw';document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const seed=()=>({seq:{q:0,i:0,c:0,p:0,l:0},customers:[],products:[],leads:[],quotes:[],invoices:[]});
let S;try{S=JSON.parse(localStorage.getItem('acme'))}catch(e){}if(!S)S=seed();
const sv=()=>{try{localStorage.setItem('acme',JSON.stringify(S))}catch(e){}};
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?d.split('-').reverse().join('-'):'';const today=()=>new Date().toISOString().slice(0,10);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function words(n){n=Math.round(n);if(!n)return 'Zero';const o='One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen'.split(' '),t='_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety'.split(' ');
const b=x=>x<20?o[x-1]||'':t[Math.floor(x/10)]+(x%10?' '+o[x%10-1]:'');const h=x=>(x>99?o[Math.floor(x/100)-1]+' Hundred '+(x%100?'':''):'')+b(x%100);
let r='',cr=Math.floor(n/1e7),l=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),rest=n%1e3;
if(cr)r+=h(cr)+' Crore ';if(l)r+=h(l)+' Lakh ';if(th)r+=h(th)+' Thousand ';if(rest)r+=h(rest);return r.trim()}
function calc(items,intra){let sub=0,disc=0,tax=0,gst=0;const rows=items.map(i=>{const base=i.qty*i.rate,d=base*i.disc/100,t=base-d,g=t*i.gst/100;sub+=base;disc+=d;tax+=t;gst+=g;return{t,g,amt:t+g}});
const raw=tax+gst,grand=Math.round(raw);return{rows,sub,disc,tax,gst,cgst:intra?gst/2:0,sgst:intra?gst/2:0,igst:intra?0:gst,round:grand-raw,grand}}
const cust=id=>S.customers.find(c=>c.id==id)||{};const intra=c=>(c.state||'Tamil Nadu')==='Tamil Nadu';
const paid=i=>i.pays.reduce((a,p)=>a+p.amt,0);
const isLow=p=>p.min>0&&p.stock<=p.min;
const istat=i=>{const p=paid(i),g=calc(i.items,i.intra).grand;return p>=g?'Paid':p>0?'Partially':i.due<today()?'Overdue':'Unpaid'};
const tag=s=>`<span class="tag ${e(s.split(' ')[0])}">${e(s)}</span>`;
const pad=n=>String(n).padStart(3,'0');
const V={dash,leads:()=>list('leads','Leads & Enquiries',['company','contact','phone','req','src','status','follow'],LF,{follow:fd,status:tag}),customers:()=>list('customers','Customers',['name','contact','mobile','gstin','state','credit'],CF,{credit:inr}),products,quotes,invoices};
const LF=[['company','Company'],['contact','Contact person'],['phone','Phone'],['req','Product requirement','w'],['src','Source',['Website','Phone','WhatsApp','Email','Walk-in']],['status','Status',['New','Contacted','Follow-up','Quotation Sent','Negotiation','Converted','Lost']],['follow','Follow-up date','date']];
const CF=[['name','Customer / company'],['contact','Contact person'],['mobile','Mobile'],['email','Email'],['gstin','GSTIN'],['state','State',['Tamil Nadu','Karnataka','Kerala','Andhra Pradesh','Telangana','Maharashtra','Gujarat','Delhi','Other']],['address','Billing address','w'],['credit','Credit limit','number']];
const PF=[['code','Product code'],['name','Product name'],['brand','Brand',['LS Electric','Autonics','Delta','Kinco','Koino','Neptune','Bals','Polycab','Qlight','Schmersal','Schneider','Other']],['cat','Category',['Proximity Sensors','Photoelectric Sensors','Rotary Encoders','Temperature Controllers','Fiber Optic Sensors','Displacement Sensors','LIDAR Sensors','Relays','Industrial Switches','Fuses','Cable Lugs','Industrial Cables','DIN Rails','Automation Components']],['hsn','HSN'],['gst','GST %','number'],['buy','Purchase price','number'],['sell','Selling price','number'],['stock','Stock','number'],['min','Min stock','number'],['unit','Unit']];
let cur='dash';
function go(k){cur=k;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));$('#m').innerHTML='';V[k]()}
const NAV=[['dash','Dashboard'],['leads','Leads'],['customers','Customers'],['products','Products'],['inventory','Inventory'],['quotes','Quotations'],['invoices','Invoices'],['purchases','Purchases'],['suppliers','Suppliers'],['accounts','Accounts'],['hr','HR'],['reports','Reports'],['settings','Settings']];
$('#nav').insertAdjacentHTML('beforeend',NAV.map(n=>`<a data-k="${n[0]}" onclick="go('${n[0]}')">${n[1]}</a>`).join(''));
function dash(){const sales=S.invoices.reduce((a,i)=>a+calc(i.items,i.intra).grand,0),rec=S.invoices.reduce((a,i)=>a+paid(i),0);
const T={Customers:'customers',Leads:'leads','Pending quotations':'quotes','Approved quotations':'quotes','Total sales':'invoices',Outstanding:'invoices',Products:'products','Low stock':'inventory'};const card=(k,v)=>`<div class="c" style="cursor:pointer" onclick="go('${T[k]}')"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const low=S.products.filter(isLow);const fu=S.leads.filter(l=>l.follow<=today()&&!['Converted','Lost'].includes(l.status));
$('#m').innerHTML=`<h2>Dashboard</h2><div class="g">${card('Customers',S.customers.length)}${card('Leads',S.leads.length)}${card('Pending quotations',S.quotes.filter(q=>['Draft','Sent'].includes(q.status)).length)}${card('Approved quotations',S.quotes.filter(q=>q.status=='Approved').length)}${card('Total sales',inr(sales))}${card('Outstanding',inr(sales-rec))}${card('Products',S.products.length)}${card('Low stock',low.length)}</div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="c"><b>Today’s follow-ups</b>${fu.map(l=>`<div>${e(l.company)} – ${e(l.req)} (${fd(l.follow)})</div>`).join('')||'<div class="k">None due</div>'}</div><div class="c"><b>Low-stock alerts</b>${low.slice(0,15).map(p=>`<div>${e(p.name)} – ${p.stock} ${e(p.unit)}</div>`).join('')||'<div class="k">All good</div>'}</div></div>`}
function list(key,title,cols,F,fm={}){const q=($('#q')||{}).value||'';
$('#m').innerHTML=`<h2>${title}</h2><div class="bar"><input id="q" placeholder="Search…" value="${e(q)}" oninput="rows()"><button onclick="edit('${key}')">+ Add</button><button class="b2" onclick="ex('xlsx','${key}')">Excel</button><button class="b2" onclick="ex('pdf','${key}')">PDF</button></div><div class="c tw"><table><thead><tr>${cols.map(c=>`<th>${F.find(f=>f[0]==c)[1]}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div><p class="k" id="cnt"></p>`;
window.LAST={key,title,cols,F};window.rows=()=>{const s=$('#q').value.toLowerCase(),LIM=250,all=S[key].filter(r=>JSON.stringify(r).toLowerCase().includes(s));$('#cnt').textContent=all.length>LIM?`Showing first ${LIM} of ${all.length} – type in the search box to find the rest.`:`${all.length} record(s)`;$('#tb').innerHTML=all.slice(0,LIM).map(r=>`<tr>${cols.map(c=>`<td>${fm[c]?fm[c](r[c],r):e(r[c])}</td>`).join('')}<td class="r"><button class="b2" onclick="edit('${key}',${r.id})">Edit</button> <button class="bd" onclick="del('${key}',${r.id})">Delete</button>${key=='leads'&&r.status!='Converted'?` <button onclick="conv(${r.id})">→ Customer</button>`:''}</td></tr>`).join('')||'<tr><td>No records</td></tr>'};rows()}
function edit(key,id){const F=FM[key],r=S[key].find(x=>x.id==id)||{};
$('#mo').innerHTML=`<div class="mo"><div class="mb"><h3>${id?'Edit':'Add'}</h3><div class="f">${F.map(f=>`<div class="${f[2]=='w'?'w':''}"><label>${f[1]}</label>${Array.isArray(f[2])?`<select id="f_${f[0]}">${f[2].map(o=>`<option ${o==r[f[0]]?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${f[0]}" type="${f[2]=='number'||f[2]=='date'?f[2]:'text'}" step="any" value="${e(r[f[0]]??'')}">`}</div>`).join('')}</div><p><button onclick="sav('${key}',${id||0})">Save</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function sav(key,id){const F=FM[key];const o={};F.forEach(f=>{let v=$('#f_'+f[0]).value;o[f[0]]=f[2]=='number'?+v||0:v});
if(!(o.name||o.company)){alert('Name is required');return}
if(id)Object.assign(S[key].find(x=>x.id==id),o);else{o.id=(S.seq[key]=(S.seq[key]||100)+1);S[key].push(o)}sv();$('#mo').innerHTML='';go(cur)}
function del(key,id){ask('Delete this record? This cannot be undone.',()=>{S[key]=S[key].filter(x=>x.id!=id);sv();go(cur)})}

function settings(){$('#m').innerHTML=`<h2>Settings</h2><div class="c"><b>${CO.n}</b><br>${CO.a}<br>GSTIN: ${CO.g}<br>${CO.p}<br>${CO.e}</div><p><button onclick="savef('acme-backup.json',JSON.stringify(S))">Download backup (JSON)</button> <button class="b2" onclick="restore()">Restore backup (JSON)</button> <button class="bd" onclick="ask('Erase ALL data and start with an empty CRM?',()=>{S=seed();ext();sv();go('dash')})">Reset data</button></p><p class="k">Data is stored in this browser only. Download a backup regularly.</p>`}
Object.assign(V,{inventory,purchases,suppliers:()=>list('suppliers','Suppliers',['name','contact','mobile','gstin','address'],SF),hr:()=>list('employees','HR & Employees',['name','desig','dept','mobile','join','salary','role'],EF,{join:fd,salary:inr}),accounts,reports,settings});
let PE=0;
const DATA={quotes:()=>['Quotations',['Quotation No','Date','Customer','Total','Status'],S.quotes.map(q=>[q.no,fd(q.date),cust(q.cid).name,calc(q.items,intra(cust(q.cid))).grand,q.status])],invoices:()=>['Invoices',['Invoice No','Date','Customer','Total','Paid','Balance','Status'],S.invoices.map(i=>{const g=calc(i.items,i.intra).grand;return[i.no,fd(i.date),cust(i.cid).name,g,paid(i),g-paid(i),istat(i)]})],purchases:()=>['Purchases',['Bill no','Date','Supplier','Product','Qty','Total'],S.purchases.map(x=>[x.bill,fd(x.date),S.suppliers.find(s=>s.id==x.sid)?.name||'',S.products.find(p=>p.id==x.pid)?.name||'',x.qty,Math.round(x.total*100)/100])]};
function ex(kind,key){let t,h,r;if(DATA[key]){[t,h,r]=DATA[key]()}else{const L=LAST;t=L.title;h=L.cols.map(c=>L.F.find(f=>f[0]==c)[1]);r=S[L.key].map(x=>L.cols.map(c=>/date|join|follow/.test(c)?fd(x[c]):(x[c]??'')))}kind=='xlsx'?xl(t,h,r):pl(t,h,r)}
function xl(t,h,r){if(!window.XLSX){toast('Excel library did not load');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...r]),'Sheet1');savef(t.replace(/\W+/g,'-').toLowerCase()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function pl(t,h,r){const J=window.jspdf;if(!J){toast('PDF library did not load');return}const d=new J.jsPDF('l');d.setFontSize(14);d.text(CO.n+' - '+t,14,14);d.autoTable({startY:20,head:[h],body:r.map(x=>x.map(v=>String(v))),styles:{fontSize:8},headStyles:{fillColor:[11,31,63]}});savef(t.replace(/\W+/g,'-').toLowerCase()+'.pdf',d.output('blob'))}
function pedit(id){const x=S.purchases.find(y=>y.id==id);PE=id;pnew();if(!$('#ps'))return;$('#ps').value=x.sid;$('#pp').value=x.pid;$('#pb').value=x.bill||'';$('#pd').value=x.date;$('#pq').value=x.qty;$('#prc').value=x.rate}
var IE;function iedit(id){IE=JSON.parse(JSON.stringify(S.invoices.find(x=>x.id==id)));rie()}
function rie(){const i=IE,I=(k,n,w)=>`<input type="number" step="any" value="${i.items[n][k]}" style="width:${w}px" onchange="IE.items[${n}].${k}=+this.value">`;$('#mo').innerHTML=`<div class="mo"><div class="mb" style="max-width:760px"><h3>Edit ${e(i.no)}</h3><div class="f"><div><label>Customer</label><select onchange="IE.cid=this.value;IE.intra=intra(cust(this.value))">${S.customers.map(c=>`<option value="${c.id}" ${c.id==i.cid?'selected':''}>${e(c.name)}</option>`).join('')}</select></div><div><label>Invoice date</label><input type="date" value="${i.date}" onchange="IE.date=this.value"></div><div><label>Due date</label><input type="date" value="${i.due}" onchange="IE.due=this.value"></div></div><div class="tw"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Disc %</th><th>GST %</th><th></th></tr></thead><tbody>${i.items.map((t,n)=>`<tr><td>${e(t.desc)}</td><td>${I('qty',n,70)}</td><td>${I('rate',n,90)}</td><td>${I('disc',n,64)}</td><td>${I('gst',n,64)}</td><td><button class="bd" onclick="IE.items.splice(${n},1);rie()">✕</button></td></tr>`).join('')}</tbody></table></div><h4>Payments</h4>${i.pays.map((p,n)=>`<div>${fd(p.date)} – ${inr(p.amt)} <button class="bd" onclick="IE.pays.splice(${n},1);rie()">Remove</button></div>`).join('')||'<div class="k">No payments</div>'}<p><button onclick="isave(${i.id})">Save changes</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function isave(id){if(!IE.items.length||IE.items.some(t=>!(t.qty>0))){toast('Keep at least one item with quantity > 0');return}if(paid(IE)>calc(IE.items,IE.intra).grand+.005){toast('Payments exceed the invoice total. Remove or reduce a payment first.');return}const o=S.invoices.find(x=>x.id==id);o.items.forEach(t=>{const p=S.products.find(x=>x.id==t.pid);if(p)p.stock+=t.qty});IE.items.forEach(t=>{const p=S.products.find(x=>x.id==t.pid);if(p)p.stock=Math.max(0,p.stock-t.qty)});S.invoices[S.invoices.findIndex(x=>x.id==id)]=IE;sv();$('#mo').innerHTML='';invoices()}

/* ===== Products page: Excel import + paste product names ===== */
function products(){list('products','Products & Inventory',['code','name','brand','cat','hsn','gst','sell','stock','min'],PF,{sell:inr,stock:(v,r)=>isLow(r)?`<b style="color:var(--er)">${v} ⚠</b>`:v});
$('.bar').insertAdjacentHTML('beforeend','<button onclick="impPick()" style="background:var(--ok)">⬆ Import from Excel</button><button onclick="pasteP()" style="background:var(--ok)">📋 Paste product names</button><button class="bd" onclick="delAllP()">Delete all</button>');
if(!S.products.length)setTimeout(pasteP,300)}
V.products=products;
function delAllP(){if(!S.products.length)return;ask('Delete ALL '+S.products.length+' products? Existing quotations and invoices keep their own copies of item details.',()=>{S.products=[];sv();go('products')})}
const BR=['LS Electric','Autonics','Delta','Kinco','Koino','Neptune','Bals','Polycab','Qlight','Schmersal','Schneider'];
const CK=[[/proxim/i,'Proximity Sensors'],[/photo/i,'Photoelectric Sensors'],[/encoder/i,'Rotary Encoders'],[/temp|pid/i,'Temperature Controllers'],[/fib(er|re)/i,'Fiber Optic Sensors'],[/lidar/i,'LIDAR Sensors'],[/displace/i,'Displacement Sensors'],[/relay/i,'Relays'],[/fuse/i,'Fuses'],[/\blugs?\b/i,'Cable Lugs'],[/din ?rail/i,'DIN Rails'],[/cable|wire|sq\.? ?mm/i,'Industrial Cables'],[/switch|push ?button|selector/i,'Industrial Switches']];
const guess=n=>({brand:BR.find(b=>n.toLowerCase().includes(b.toLowerCase()))||'Other',cat:(CK.find(k=>k[0].test(n))||[0,'Automation Components'])[1]});
function pasteP(){$('#mo').innerHTML=`<div class="mo"><div class="mb" style="max-width:640px"><h3>Add products from Excel</h3><p class="k">1) Open your ACME_OVERALL_STOCK.xlsx &nbsp; 2) Click inside the sheet, press Ctrl+A then Ctrl+C &nbsp; 3) Paste here (Ctrl+V) &nbsp; 4) Click "Add products".<br>One product per line. If the first row has headings (Name, Stock, Price…), those columns are picked up too.</p><textarea id="pt" rows="12" placeholder="Paste product names here…"></textarea><p><button onclick="pasteGo()">Add products</button> <button class="b2" onclick="$('#mo').innerHTML=''">Cancel</button></p></div></div>`}
function pasteGo(){const rows=$('#pt').value.split(/\r?\n/).map(l=>l.split('\t')).filter(r=>r.some(v=>v.trim()));if(!rows.length){toast('Paste the product names first');return}$('#mo').innerHTML='';impGo(rows)}
function impPick(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>impRead(i.files[0]);i.click()}
function impRead(f){if(!f)return;if(!window.XLSX){toast('Excel library did not load. Check your connection.');return}const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false}).filter(x=>x.some(v=>String(v).trim()));impGo(rows)}catch(x){toast('Could not read that file')}};r.readAsArrayBuffer(f)}
function impGo(rows){if(!rows.length){toast('The file is empty');return}
const M={name:/name|item|product|desc|particular/i,code:/code|sku|part/i,brand:/brand|make/i,cat:/categ|group/i,hsn:/hsn/i,gst:/gst|tax/i,buy:/buy|purchase|cost/i,sell:/sell|price|rate|mrp/i,stock:/stock|qty|quantity|closing|balance/i,min:/\bmin|reorder/i,unit:/unit|uom/i};
let map={name:0},start=0;const h=rows[0].map(String);
if(rows[0].length>1&&h.some(x=>M.name.test(x))){map={};start=1;Object.keys(M).forEach(k=>{const j=h.findIndex((x,ix)=>M[k].test(x)&&!Object.values(map).includes(ix));if(j>=0)map[k]=j});if(map.name==null)map.name=0}
const have=new Set(S.products.map(p=>String(p.name).trim().toLowerCase()));let dup=0;const add=[];
rows.slice(start).forEach(r=>{const nm=String(r[map.name]??'').trim();if(!nm||/^list of/i.test(nm))return;const k=nm.toLowerCase();if(have.has(k)){dup++;return}have.add(k);
const g=guess(nm),num=j=>j==null?0:parseFloat(String(r[j]).replace(/,/g,''))||0,tx=j=>j==null?'':String(r[j]).trim();
add.push({name:nm,code:tx(map.code),brand:tx(map.brand)||g.brand,cat:tx(map.cat)||g.cat,hsn:tx(map.hsn),gst:num(map.gst)||18,buy:num(map.buy),sell:num(map.sell),stock:num(map.stock),min:num(map.min),unit:tx(map.unit)||'Nos'})});
if(!add.length){toast(dup?'All '+dup+' items already exist':'No items found');return}
ask(`Found <b>${add.length}</b> new item(s)${dup?` (${dup} duplicates skipped)`:''}. Add them to Products? Brand and category are guessed from the name; GST defaults to 18% – you can edit any item afterwards.`,()=>{add.forEach(p=>{p.id=S.seq.products=(S.seq.products||100)+1;if(!p.code)p.code='ACM-'+String(p.id).padStart(4,'0');S.products.push(p)});sv();go('products');toast(add.length+' products added')})}
/* ===== Backup restore ===== */
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.products||!o.customers)throw 0;ask('Replace all current data with this backup?',()=>{S=o;ext();sv();go('dash')})}catch(x){toast('That is not a valid backup file')}};r.readAsText(i.files[0])};i.click()}
/* ===== Richer dashboard ===== */
const d0=dash;V.dash=()=>{d0();const inv=S.invoices,G=i=>calc(i.items,i.intra).grand;
const bar=(rows,fmt=x=>x)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${e(r[0])}</span><b>${fmt(r[1])}</b></div><div style="height:7px;background:var(--bd);border-radius:4px"><div style="height:7px;width:${r[1]/mx*100}%;background:var(--bl);border-radius:4px"></div></div></div>`).join('')||'<div class="k">No data yet</div>'};
const ms=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(15);d.setMonth(d.getMonth()-k);ms.push(d.toISOString().slice(0,7))}
const mon=ms.map(m=>[new Date(m+'-15').toLocaleString('en',{month:'short',year:'2-digit'}),inv.filter(i=>i.date.slice(0,7)==m).reduce((a,i)=>a+G(i),0)]);
const pipe=['New','Contacted','Follow-up','Quotation Sent','Negotiation','Converted','Lost'].map(s=>[s,S.leads.filter(l=>l.status==s).length]);
const top=S.customers.map(c=>[c.name,inv.filter(i=>i.cid==c.id).reduce((a,i)=>a+G(i),0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
const ag=[['Not yet due',0],['1–30 days late',0],['31–60 days late',0],['60+ days late',0]];inv.forEach(i=>{const b=G(i)-paid(i);if(b<=.005)return;const dd=Math.floor((Date.now()-new Date(i.due))/864e5);ag[dd<=0?0:dd<=30?1:dd<=60?2:3][1]+=b});
const sv2=S.products.reduce((a,p)=>a+p.stock*p.buy,0),qc=S.quotes.length,won=S.quotes.filter(q=>q.status=='Approved').length;
const bx=(t,b)=>`<div class="c"><b>${t}</b>${b}</div>`;
$('#m').insertAdjacentHTML('beforeend',`<div class="g"><div class="c"><div class="k">Stock value (at purchase price)</div><div class="v">${inr(sv2)}</div></div><div class="c"><div class="k">Quotation win rate</div><div class="v">${qc?Math.round(won/qc*100):0}%</div></div><div class="c"><div class="k">Lead conversion</div><div class="v">${S.leads.length?Math.round(S.leads.filter(l=>l.status=='Converted').length/S.leads.length*100):0}%</div></div></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${bx('Sales – last 6 months',bar(mon,inr))}${bx('Lead pipeline',bar(pipe))}${bx('Top customers',bar(top,inr))}${bx('Receivables ageing',bar(ag,inr))}</div>`)};
go('dash');
</script></body></html>
